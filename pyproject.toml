[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mcp-mail"
version = "0.1.0"
description = "Read-only IMAP mail MCP server."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "mcp-mail contributors" }
]
dependencies = [
  "imapclient>=4.1,<5",
  "markdownify>=1.2,<2",
  "beautifulsoup4>=4.13,<5",
  "mcp>=2.0,<3",
  "PyYAML>=6.0,<7",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.13,<1",
]

[project.scripts]
mcp-mail = "mcp_mail.server:main"
mail-smoke = "mcp_mail.smoke:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_mail"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
